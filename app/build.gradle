
plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.mirrororo.sender'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mirrororo.sender'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
}
